<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEB BR — GitHub Tools Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #111118;
            --bg-card: rgba(255,255,255,0.03);
            --bg-card-hover: rgba(255,255,255,0.06);
            --border: rgba(255,255,255,0.08);
            --border-hover: rgba(255,255,255,0.15);
            --text-primary: #f0f0f5;
            --text-secondary: #8a8a9a;
            --text-muted: #5a5a6a;
            --accent-cyan: #00d4ff;
            --accent-purple: #a855f7;
            --accent-pink: #ec4899;
            --accent-green: #22c55e;
            --accent-orange: #f97316;
            --shadow-glow: 0 0 40px rgba(0,212,255,0.08);
            --radius: 16px;
            --radius-sm: 10px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Background ambient */
        .ambient {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }
        .ambient::before {
            content: '';
            position: absolute;
            top: -20%;
            left: -10%;
            width: 60%;
            height: 60%;
            background: radial-gradient(circle, rgba(0,212,255,0.08) 0%, transparent 70%);
            animation: float 20s ease-in-out infinite;
        }
        .ambient::after {
            content: '';
            position: absolute;
            bottom: -20%;
            right: -10%;
            width: 50%;
            height: 50%;
            background: radial-gradient(circle, rgba(168,85,247,0.06) 0%, transparent 70%);
            animation: float 25s ease-in-out infinite reverse;
        }
        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -30px) scale(1.05); }
            66% { transform: translate(-20px, 20px) scale(0.95); }
        }

        /* Noise texture overlay */
        .noise {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            opacity: 0.025;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        }

        /* Layout */
        .container {
            position: relative;
            z-index: 2;
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* Header */
        header {
            padding: 48px 0 32px;
            text-align: center;
        }
        .logo-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 16px;
            background: rgba(0,212,255,0.08);
            border: 1px solid rgba(0,212,255,0.15);
            border-radius: 100px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--accent-cyan);
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
        }
        .logo-badge .dot {
            width: 6px;
            height: 6px;
            background: var(--accent-cyan);
            border-radius: 50%;
            animation: pulse-dot 2s infinite;
        }
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(0,212,255,0.4); }
            50% { opacity: 0.6; box-shadow: 0 0 0 6px rgba(0,212,255,0); }
        }
        h1 {
            font-size: clamp(2rem, 5vw, 3.2rem);
            font-weight: 800;
            letter-spacing: -0.03em;
            line-height: 1.1;
            margin-bottom: 12px;
        }
        h1 .gradient {
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple), var(--accent-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .subtitle {
            color: var(--text-secondary);
            font-size: 1.05rem;
            max-width: 500px;
            margin: 0 auto;
        }

        /* Stats bar */
        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 32px;
            margin: 32px 0;
            flex-wrap: wrap;
        }
        .stat {
            text-align: center;
        }
        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
        }
        .stat-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        /* Controls */
        .controls {
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-width: 640px;
            margin: 0 auto 40px;
        }
        .search-wrap {
            position: relative;
        }
        .search-wrap input {
            width: 100%;
            padding: 16px 20px 16px 52px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text-primary);
            font-size: 0.95rem;
            font-family: inherit;
            outline: none;
            transition: all 0.3s ease;
        }
        .search-wrap input::placeholder { color: var(--text-muted); }
        .search-wrap input:focus {
            border-color: var(--accent-cyan);
            background: var(--bg-card-hover);
            box-shadow: 0 0 0 3px rgba(0,212,255,0.1);
        }
        .search-wrap svg {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            color: var(--text-muted);
            pointer-events: none;
            transition: color 0.3s;
        }
        .search-wrap input:focus + svg { color: var(--accent-cyan); }

        .filter-tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .filter-tag {
            padding: 6px 14px;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 100px;
            color: var(--text-secondary);
            font-size: 0.8rem;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.25s ease;
            user-select: none;
        }
        .filter-tag:hover {
            border-color: var(--border-hover);
            color: var(--text-primary);
        }
        .filter-tag.active {
            background: rgba(0,212,255,0.1);
            border-color: rgba(0,212,255,0.3);
            color: var(--accent-cyan);
        }

        /* Grid */
        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 60px;
        }

        /* Card */
        .tool-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            gap: 14px;
            opacity: 0;
            transform: translateY(20px);
            animation: card-enter 0.5s ease forwards;
        }
        @keyframes card-enter {
            to { opacity: 1; transform: translateY(0); }
        }
        .tool-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple));
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.4s ease;
        }
        .tool-card:hover::before { transform: scaleX(1); }
        .tool-card:hover {
            transform: translateY(-4px);
            background: var(--bg-card-hover);
            border-color: var(--border-hover);
            box-shadow: var(--shadow-glow), 0 20px 40px rgba(0,0,0,0.3);
        }

        .card-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
        }
        .card-icon {
            width: 44px;
            height: 44px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            font-weight: 700;
            color: #fff;
            flex-shrink: 0;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            position: relative;
            overflow: hidden;
        }
        .card-icon::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, transparent 40%, rgba(255,255,255,0.15) 100%);
        }
        .card-meta {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
        }
        .card-lang {
            font-size: 0.7rem;
            color: var(--text-muted);
            background: rgba(255,255,255,0.04);
            padding: 2px 8px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
        }
        .card-stars {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .card-body { flex: 1; }
        .card-title {
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 6px;
            letter-spacing: -0.01em;
        }
        .card-desc {
            font-size: 0.85rem;
            color: var(--text-secondary);
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: auto;
            padding-top: 14px;
            border-top: 1px solid var(--border);
        }
        .card-tags {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .card-tag {
            font-size: 0.7rem;
            color: var(--text-muted);
            background: rgba(255,255,255,0.03);
            padding: 3px 8px;
            border-radius: 4px;
            border: 1px solid var(--border);
        }
        .card-link {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8rem;
            color: var(--accent-cyan);
            opacity: 0.7;
            transition: opacity 0.3s;
        }
        .tool-card:hover .card-link { opacity: 1; }

        /* Skeleton loading */
        .skeleton {
            background: linear-gradient(90deg, var(--bg-card) 25%, var(--bg-card-hover) 50%, var(--bg-card) 75%);
            background-size: 200% 100%;
            animation: skeleton 1.5s infinite;
            border-radius: 8px;
        }
        @keyframes skeleton {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        .skeleton-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            height: 180px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .skeleton-icon { width: 44px; height: 44px; border-radius: var(--radius-sm); }
        .skeleton-title { width: 60%; height: 20px; }
        .skeleton-line { width: 100%; height: 14px; }
        .skeleton-line.short { width: 40%; }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-muted);
        }
        .empty-state svg {
            width: 64px;
            height: 64px;
            margin-bottom: 16px;
            opacity: 0.3;
        }
        .empty-state h3 {
            color: var(--text-secondary);
            font-size: 1.2rem;
            margin-bottom: 8px;
        }

        /* Error state */
        .error-state {
            text-align: center;
            padding: 60px 20px;
            max-width: 500px;
            margin: 0 auto;
        }
        .error-state h3 {
            color: var(--accent-pink);
            margin-bottom: 8px;
        }
        .retry-btn {
            margin-top: 20px;
            padding: 10px 24px;
            background: rgba(0,212,255,0.1);
            border: 1px solid rgba(0,212,255,0.2);
            border-radius: var(--radius-sm);
            color: var(--accent-cyan);
            font-family: inherit;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s;
        }
        .retry-btn:hover {
            background: rgba(0,212,255,0.15);
            transform: translateY(-1px);
        }

        /* Iframe Overlay */
        .iframe-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(12px);
            z-index: 9999;
            flex-direction: column;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .iframe-overlay.active {
            display: flex;
            opacity: 1;
        }
        .iframe-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            background: rgba(10,10,15,0.9);
            border-bottom: 1px solid var(--border);
            gap: 16px;
        }
        .iframe-info {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }
        .iframe-favicon {
            width: 20px;
            height: 20px;
            border-radius: 4px;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.6rem;
            font-weight: 700;
            color: #fff;
            flex-shrink: 0;
        }
        .iframe-url {
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-family: 'Courier New', monospace;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            min-width: 0;
        }
        .iframe-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }
        .iframe-btn {
            padding: 6px 14px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-secondary);
            font-size: 0.8rem;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .iframe-btn:hover {
            background: rgba(255,255,255,0.1);
            color: var(--text-primary);
            border-color: var(--border-hover);
        }
        .iframe-btn.close:hover {
            background: rgba(239,68,68,0.15);
            border-color: rgba(239,68,68,0.3);
            color: #ef4444;
        }
        iframe {
            flex: 1;
            width: 100%;
            border: none;
            background: #fff;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 40px 0 60px;
            color: var(--text-muted);
            font-size: 0.85rem;
        }
        footer a {
            color: var(--accent-cyan);
            text-decoration: none;
            opacity: 0.7;
            transition: opacity 0.3s;
        }
        footer a:hover { opacity: 1; }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-primary); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--border-hover); }

        /* Responsive */
        @media (max-width: 640px) {
            .tools-grid { grid-template-columns: 1fr; }
            .iframe-header { padding: 10px 14px; }
            .iframe-url { font-size: 0.75rem; max-width: 150px; }
        }
    </style>
</head>
<body>
    <div class="ambient"></div>
    <div class="noise"></div>

    <div class="container">
        <header>
            <div class="logo-badge">
                <span class="dot"></span>
                web-br GitHub
            </div>
            <h1><span class="gradient">WEB BR</span></h1>
            <p class="subtitle">Dashboard de ferramentas e utilitários. Dados sincronizados diretamente da API do GitHub.</p>

            <div class="stats-bar" id="statsBar">
                <div class="stat">
                    <div class="stat-value" id="statRepos">—</div>
                    <div class="stat-label">Repositórios</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="statLangs">—</div>
                    <div class="stat-label">Linguagens</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="statUpdated">—</div>
                    <div class="stat-label">Atualizado</div>
                </div>
            </div>
        </header>

        <div class="controls">
            <div class="search-wrap">
                <input type="text" id="searchInput" placeholder="Buscar repositório, tag ou linguagem..." autocomplete="off">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            </div>
            <div class="filter-tags" id="filterTags"></div>
        </div>

        <div class="tools-grid" id="toolsGrid">
            <!-- Skeletons -->
            <div class="skeleton-card"><div class="skeleton skeleton-icon"></div><div class="skeleton skeleton-title"></div><div class="skeleton skeleton-line"></div><div class="skeleton skeleton-line short"></div></div>
            <div class="skeleton-card"><div class="skeleton skeleton-icon"></div><div class="skeleton skeleton-title"></div><div class="skeleton skeleton-line"></div><div class="skeleton skeleton-line short"></div></div>
            <div class="skeleton-card"><div class="skeleton skeleton-icon"></div><div class="skeleton skeleton-title"></div><div class="skeleton skeleton-line"></div><div class="skeleton skeleton-line short"></div></div>
            <div class="skeleton-card"><div class="skeleton skeleton-icon"></div><div class="skeleton skeleton-title"></div><div class="skeleton skeleton-line"></div><div class="skeleton skeleton-line short"></div></div>
            <div class="skeleton-card"><div class="skeleton skeleton-icon"></div><div class="skeleton skeleton-title"></div><div class="skeleton skeleton-line"></div><div class="skeleton skeleton-line short"></div></div>
            <div class="skeleton-card"><div class="skeleton skeleton-icon"></div><div class="skeleton skeleton-title"></div><div class="skeleton skeleton-line"></div><div class="skeleton skeleton-line short"></div></div>
        </div>

        <footer>
            <p>Powered by <a href="https://github.com/web-br" target="_blank">web-br</a> · Dados via GitHub API · <span id="fetchTime"></span></p>
        </footer>
    </div>

    <!-- Iframe Overlay -->
    <div class="iframe-overlay" id="iframeOverlay">
        <div class="iframe-header">
            <div class="iframe-info">
                <div class="iframe-favicon" id="iframeFavicon">W</div>
                <span class="iframe-url" id="iframeUrl">https://web-br.github.io/</span>
            </div>
            <div class="iframe-actions">
                <a href="#" class="iframe-btn" id="iframeOpenNew" target="_blank">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
                    Abrir
                </a>
                <button class="iframe-btn close" onclick="closeIframe()">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                    Fechar
                </button>
            </div>
        </div>
        <iframe id="toolIframe" src="" allow="fullscreen" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
    </div>

    <script>
        const API_URL = 'https://api.github.com/users/web-br/repos?per_page=100&sort=updated';
        const INFO_URL = './info.json';
        const BASE_URL = 'https://web-br.github.io/';

        let allRepos = [];
        let infoData = {};
        let currentFilter = 'all';

        // Ícones de linguagens
        const langIcons = {
            'HTML': '🌐',
            'CSS': '🎨',
            'JavaScript': '⚡',
            'TypeScript': '🔷',
            'PHP': '🐘',
            'Python': '🐍',
            'Java': '☕',
            'Ruby': '💎',
            'Go': '🔵',
            'Rust': '⚙️',
            'C': '🔧',
            'C++': '🔧',
            'C#': '🔧',
            'Shell': '🐚',
            'Swift': '🍎',
            'Kotlin': '🟣',
            'Vue': '💚',
            'React': '⚛️'
        };

        // Cores de gradiente por categoria
        const categoryGradients = {
            'Utilitários': 'linear-gradient(135deg, #00d4ff, #0891b2)',
            'Infraestrutura': 'linear-gradient(135deg, #a855f7, #7c3aed)',
            'Redes Sociais': 'linear-gradient(135deg, #ec4899, #db2777)',
            'Emuladores': 'linear-gradient(135deg, #f97316, #ea580c)',
            'Streaming': 'linear-gradient(135deg, #ef4444, #dc2626)',
            'Entretenimento': 'linear-gradient(135deg, #8b5cf6, #6d28d9)',
            'Fiscal': 'linear-gradient(135deg, #22c55e, #16a34a)',
            'Loja': 'linear-gradient(135deg, #06b6d4, #0891b2)',
            'Produtividade': 'linear-gradient(135deg, #14b8a6, #0d9488)',
            'Repositório': 'linear-gradient(135deg, #6366f1, #4f46e5)',
            'default': 'linear-gradient(135deg, #00d4ff, #a855f7)'
        };

        async function init() {
            try {
                // Carregar info.json em paralelo com a API
                const [apiRes, infoRes] = await Promise.allSettled([
                    fetch(API_URL),
                    fetch(INFO_URL)
                ]);

                // Processar info.json
                if (infoRes.status === 'fulfilled' && infoRes.value.ok) {
                    infoData = await infoRes.value.json();
                } else {
                    console.warn('info.json não encontrado ou inválido. Usando dados da API apenas.');
                    infoData = {};
                }

                // Processar API
                if (apiRes.status === 'fulfilled' && apiRes.value.ok) {
                    allRepos = await apiRes.value.json();
                    // Ordenar: repos com info.json primeiro, depois por nome
                    allRepos.sort((a, b) => {
                        const aHasInfo = infoData[a.name] ? 1 : 0;
                        const bHasInfo = infoData[b.name] ? 1 : 0;
                        if (aHasInfo !== bHasInfo) return bHasInfo - aHasInfo;
                        return a.name.localeCompare(b.name);
                    });
                } else {
                    throw new Error('Falha ao carregar repositórios da API do GitHub');
                }

                updateStats();
                renderTags();
                renderTools();
                document.getElementById('fetchTime').textContent = new Date().toLocaleString('pt-BR');

            } catch (err) {
                console.error(err);
                showError(err.message);
            }
        }

        function updateStats() {
            document.getElementById('statRepos').textContent = allRepos.length;
            const langs = [...new Set(allRepos.map(r => r.language).filter(Boolean))];
            document.getElementById('statLangs').textContent = langs.length;
            const lastUpdated = allRepos.length > 0
                ? new Date(Math.max(...allRepos.map(r => new Date(r.updated_at)))).toLocaleDateString('pt-BR', { day: '2-digit', month: 'short' })
                : '—';
            document.getElementById('statUpdated').textContent = lastUpdated;
        }

        function renderTags() {
            const categories = new Set();
            allRepos.forEach(repo => {
                const info = infoData[repo.name];
                if (info?.category) categories.add(info.category);
            });

            const container = document.getElementById('filterTags');
            const tags = ['all', ...Array.from(categories).sort()];

            container.innerHTML = tags.map(tag => `
                <button class="filter-tag ${tag === 'all' ? 'active' : ''}" data-tag="${tag}" onclick="setFilter('${tag}')">
                    ${tag === 'all' ? 'Todos' : tag}
                </button>
            `).join('');
        }

        function setFilter(tag) {
            currentFilter = tag;
            document.querySelectorAll('.filter-tag').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.tag === tag);
            });
            renderTools();
        }

        function getRepoInfo(repo) {
            const info = infoData[repo.name];
            const title = info?.title || repo.name;
            const description = info?.description || repo.description || 'Repositório web-br/' + repo.name;
            const category = info?.category || 'Geral';
            const tags = info?.tags || [];
            const icon = info?.icon || repo.name.charAt(0).toUpperCase();
            const gradient = categoryGradients[category] || categoryGradients['default'];
            const langIcon = langIcons[repo.language] || '📄';
            return { title, description, category, tags, icon, gradient, langIcon };
        }

        function renderTools() {
            const grid = document.getElementById('toolsGrid');
            const search = document.getElementById('searchInput').value.toLowerCase().trim();

            const filtered = allRepos.filter(repo => {
                const info = getRepoInfo(repo);
                const matchesSearch = !search ||
                    repo.name.toLowerCase().includes(search) ||
                    info.title.toLowerCase().includes(search) ||
                    info.description.toLowerCase().includes(search) ||
                    info.tags.some(t => t.toLowerCase().includes(search)) ||
                    (repo.language || '').toLowerCase().includes(search);

                const matchesCategory = currentFilter === 'all' || info.category === currentFilter;

                return matchesSearch && matchesCategory;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state" style="grid-column: 1 / -1;">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                        <h3>Nenhum resultado encontrado</h3>
                        <p>Tente outro termo de busca ou categoria.</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = filtered.map((repo, i) => {
                const info = getRepoInfo(repo);
                const url = repo.homepage || (BASE_URL + repo.name);
                const stars = repo.stargazers_count || 0;
                const delay = i * 0.05;

                return `
                    <div class="tool-card" onclick="openTool('${repo.name}', '${url}')" style="animation-delay: ${delay}s">
                        <div class="card-header">
                            <div class="card-icon" style="background: ${info.gradient}">${info.icon}</div>
                            <div class="card-meta">
                                ${repo.language ? `<span class="card-lang">${info.langIcon} ${repo.language}</span>` : ''}
                                ${stars > 0 ? `<span class="card-stars">⭐ ${stars}</span>` : ''}
                            </div>
                        </div>
                        <div class="card-body">
                            <div class="card-title">${info.title}</div>
                            <div class="card-desc">${info.description}</div>
                        </div>
                        <div class="card-footer">
                            <div class="card-tags">
                                <span class="card-tag">${info.category}</span>
                                ${info.tags.slice(0, 2).map(t => `<span class="card-tag">${t}</span>`).join('')}
                            </div>
                            <div class="card-link">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
                                Abrir
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function openTool(name, url) {
            const overlay = document.getElementById('iframeOverlay');
            const iframe = document.getElementById('toolIframe');
            const urlEl = document.getElementById('iframeUrl');
            const favicon = document.getElementById('iframeFavicon');
            const openBtn = document.getElementById('iframeOpenNew');

            iframe.src = url;
            urlEl.textContent = url;
            favicon.textContent = name.charAt(0).toUpperCase();
            openBtn.href = url;

            overlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeIframe() {
            const overlay = document.getElementById('iframeOverlay');
            const iframe = document.getElementById('toolIframe');
            overlay.classList.remove('active');
            setTimeout(() => { iframe.src = ''; }, 300);
            document.body.style.overflow = '';
        }

        function showError(msg) {
            document.getElementById('toolsGrid').innerHTML = `
                <div class="error-state" style="grid-column: 1 / -1;">
                    <h3>⚠️ ${msg}</h3>
                    <p>Verifique sua conexão ou tente novamente mais tarde.</p>
                    <button class="retry-btn" onclick="location.reload()">🔄 Tentar novamente</button>
                </div>
            `;
        }

        // Event listeners
        document.getElementById('searchInput').addEventListener('input', renderTools);

        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') closeIframe();
            if (e.key === '/' && document.activeElement.tagName !== 'INPUT') {
                e.preventDefault();
                document.getElementById('searchInput').focus();
            }
        });

        document.getElementById('iframeOverlay').addEventListener('click', e => {
            if (e.target === e.currentTarget) closeIframe();
        });

        // Inicializar
        init();
    </script>
</body>
</html>
